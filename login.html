<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="./css/login.css">
</head>
<body>
    <div class="container">
        <h1>Login</h1>

        <form>
            <div class="form-control">
                <label for="login">Login: </label>
                <input type="text" id="login" placeholder="Digite seu login">
            </div>

            <div class="form-control">
                <label for="email">Email: </label>
                <input type="email" id="Email" placeholder="Digite seu email">
            </div>

            <div class="form-control">
                <label for="senha">Senha: </label>
                <input type="password" id="login" placeholder="Digite sua senha">
            </div>

            <div class="form-control">
                <div class="opcoes">
                    <input type="checkbox" id="lembrar">
                    <label for="Lembrar">Lembrar meu login</label>
                </div>

                <div class="form-control">
                    <label>Tipo de acesso</label>

                    <div class="opcoes">
                        <input type="radio" id="aluno" value="aluno">
                        <label for="aluno">Aluno</label>

                        <input type="radio" id="professor" value="professor">
                        <label for="professor">Professor</label>
                    </div>

                    <div class="form-control">
                        <label for="cidade">Cidade: </label>

                        <select id="cidade">
                            <option value="">Selecione sua cidade</option>
                            <option value="jundiai">Jundiaí</option>
                            <option value="sao paulo">São Paulo</option>
                            <option value="rio de janeiro">Rio de Janeiro</option>
                        </select>

                        <div class="form-control">
                            <button type="submit">Entrar</button>
                        </div>
                    </div>
                </div>
            </div>

            <a href="senha.html">Esqueci a senha</a>
            
        </form>
    </div>
</body>
</html>

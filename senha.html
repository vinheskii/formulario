<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Senha</title>
    <link rel="stylesheet" href="./css/senha.css">
</head>
<body>
    <div class="container">
        <h1>Esqueceu a senha?</h1>
        <p>Escolha uma das opções abaixo para <br>redefinir sua senha</p>

         <form>
            <div class="form-control">
                <label for="email">Email: </label>
                <input type="email" id="email" placeholder="Digite seu email">
            </div>
            
            <div class="form-control">
              <a href="email.html">Entrar</a>
            </div>

            <div class="form-control">
                <label for="celular">Celular: </label>
                <input type="tel" id="celular" placeholder="Digite seu telefone">
            </div>

            <div class="form-control">
             <a href="celular.html">Entrar</a>
            </div>
         </form>
    </div>
</body>
</html>
